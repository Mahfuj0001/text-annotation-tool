<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Annotation Tool</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#16232e;--mute:#5d6f7d;--pos:#1f8a5b;--neg:#c2413b;--neu:#4a6fa5;--line:#d5dee5}
@media(prefers-color-scheme:dark){:root{--bg:#10181f;--card:#18232d;--ink:#e6edf2;--mute:#8da0ae;--line:#2b3a47}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}p.s{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:8px;padding:12px;cursor:pointer;color:#fff;font-weight:600}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--neu);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.pos{background:var(--pos)}.neg{background:var(--neg)}.neu{background:var(--neu)}.gh{background:var(--mute)}
#text{font-size:18px;min-height:56px}#prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
#bar{height:100%;width:0;background:var(--neu);transition:width .2s}
#count{font-size:13px;color:var(--mute);margin-bottom:6px}
</style></head><body>
<h1>Text Annotation Tool</h1>
<p class="s">Paste one sentence per line, label each as positive, negative or neutral, then export.</p>
<div class="card"><textarea id="input" placeholder="Paste sentences here, one per line"></textarea>
<div class="row"><button class="gh" id="load">Load sentences</button></div></div>
<div class="card" id="work" hidden>
<div id="count"></div><div id="prog"><div id="bar"></div></div>
<div id="text"></div>
<div class="row"><button class="pos" data-l="positive">Positive</button><button class="neu" data-l="neutral">Neutral</button><button class="neg" data-l="negative">Negative</button></div>
<div class="row"><button class="gh" id="undo">Undo</button><button class="gh" id="csv">Export CSV</button><button class="gh" id="json">Export JSON</button></div>
</div>
<script>
let items=[],i=0;const $=id=>document.getElementById(id);
function render(){const done=i>=items.length;$('count').textContent=done?`All ${items.length} labeled`:`Item ${i+1} of ${items.length}`;
$('bar').style.width=(items.length?i/items.length*100:0)+'%';$('text').textContent=done?'Finished. Export your labels below.':items[i].text;
document.querySelectorAll('[data-l]').forEach(b=>b.disabled=done)}
$('load').onclick=()=>{items=$('input').value.split('\n').map(t=>t.trim()).filter(Boolean).map(text=>({text,label:null}));
if(!items.length)return;i=0;$('work').hidden=false;render()};
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(i<items.length){items[i].label=b.dataset.l;i++;render()}});
$('undo').onclick=()=>{if(i>0){i--;items[i].label=null;render()}};
function save(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
$('json').onclick=()=>save('labels.json',JSON.stringify(items,null,2),'application/json');
$('csv').onclick=()=>save('labels.csv','text,label\n'+items.map(x=>`"${x.text.replace(/"/g,'""')}",${x.label||''}`).join('\n'),'text/csv');
</script></body></html>
